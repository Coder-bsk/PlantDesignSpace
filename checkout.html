<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="logo.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Send your request | Plant design Space</title><meta name="description" content="Send a request for the tools in your cart to Plant design Space.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script>try{var t=localStorage.getItem("pds-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script></head><body><div id="hd"></div>
<section class="pg"><div class="wrap"><h1>Send your request</h1><p class="lead">Review the tools in your cart and send us your details. We reply by email to confirm the price and share licence details.</p>
<div id="empty" hidden><p class="lead">Your cart is empty.</p><a class="btn" href="tools/index.html">Browse tools</a></div>
<div class="two" id="co"><div class="panel"><h3>Your tools</h3><div id="items"></div><div class="line"><span class="tot">Estimated total</span><span class="tot" id="tt"></span></div><p class="mut" style="font-size:.85rem;margin:10px 0 0">Prices are indicative. We confirm the final price by email.</p></div>
<div class="panel"><h3>Your details</h3><form id="rf2"><label class="f">Name<input name="name" required autocomplete="name"></label><label class="f">Email<input name="email" type="email" required autocomplete="email"></label>
<label class="f">Phone with country code<input name="phone" type="tel" required placeholder="+91 98765 43210" autocomplete="tel" pattern="\+[0-9][0-9 \-]{7,20}" title="Start with + and the country code, for example +91 98765 43210"></label>
<label class="f">Note (optional)<textarea name="note" rows="3"></textarea></label><button class="btn y" style="width:100%">Send request</button><div class="msg" id="om" role="status"></div></form></div></div></div></section>
<div id="ft"></div>
<script>var ROOT=""</script><script src="site-data.js"></script><script src="app.js"></script>
<script>
function calc(){const c=cart.get(),it=Object.entries(c).map(([k,p])=>{const t=TOOLS.find(x=>x.name==k);return t?{k,p,v:t.price[p]}:null}).filter(Boolean);return{it,tt:it.reduce((a,b)=>a+b.v,0)}}
function draw(){const r=calc();$('#empty').hidden=r.it.length>0;$('#co').hidden=!r.it.length;
 $('#items').innerHTML=r.it.map(i=>`<div class="line"><span>${i.k} <small>(${i.p})</small> <button class="x" data-k="${i.k}">Remove</button></span><b>${inr(i.v)}</b></div>`).join('');$('#tt').textContent=inr(r.tt)}
$('#items').onclick=e=>{const k=e.target.dataset.k;if(!k)return;const c=cart.get();delete c[k];cart.set(c);draw()};
$('#rf2').onsubmit=async e=>{e.preventDefault();const r=calc(),f=Object.fromEntries(new FormData(e.target)),m=$('#om');if(!r.it.length)return;
 if(!phoneOk(f.phone)){m.className='msg er';m.textContent='Enter your phone number with the country code, for example +91 98765 43210.';return}
 const lines=r.it.map(i=>'- '+i.k+' ('+i.p+'): '+inr(i.v)).join('\n');
 try{m.className='msg';m.textContent='Sending…';
  const res=await send({name:f.name,email:f.email,phone:f.phone,subject:'Tool request from '+f.name,message:'Tools requested:\n'+lines+'\nEstimated total: '+inr(r.tt)+(f.note?'\nNote: '+f.note:'')},'cart');
  if(res=='sent'){cart.set({});$('#co').innerHTML='<div class="panel"><h3>Request sent</h3><p>Thank you. We will email '+f.email+' to confirm the price and licence details.</p><a class="btn" href="tools/index.html">Back to tools</a></div>'}
  else{m.className='msg ok';m.textContent='Your email app has opened with the request. Press Send there to finish. Your cart is kept until then.'}
 }catch(x){m.className='msg er';m.textContent=x.message||('Could not send. Email us at '+CFG.email)}};
draw();
</script></body></html>
