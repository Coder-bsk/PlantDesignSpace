<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="logo.svg" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Enquiry | Plant design Space</title><meta name="description" content="Send an enquiry to Plant design Space.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script>try{var t=localStorage.getItem("pds-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script></head><body><div id="hd"></div>
<section class="pg"><div class="wrap"><div class="two"><div><h1>Enquiry</h1><p class="lead">Ask about consulting, training dates, or anything else. You'll get a confirmation email straight away and a reply from us soon after.</p><p>Or write to <a href="mailto:plantdesignspace@gmail.com">plantdesignspace@gmail.com</a></p></div>
<div class="panel"><form id="ef"><label class="f">Your name<input name="name" required></label><label class="f">Email<input name="email" type="email" required></label>
<label class="f">Phone (optional)<input name="phone" type="tel"></label>
<label class="f">Topic<select name="topic" id="tp"></select></label>
<label class="f">Message<textarea name="message" rows="5" required></textarea></label><button class="btn">Send enquiry</button><div class="msg" id="em" role="status"></div></form></div></div></div></section>
<div id="ft"></div><script>var ROOT=""</script><script src="site-data.js"></script><script src="app.js"></script>
<script>
$('#tp').innerHTML=[...S.services.map(x=>x.topic),...S.training.map(x=>x.topic),...(S.tools.length?['Automation tools']:[]),'Other'].map(x=>`<option>${x}</option>`).join('');
const q=new URLSearchParams(location.search).get('topic');if(q)$('#tp').value=q;
$('#ef').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),m=$('#em');
 try{m.className='msg';m.textContent='Sending…';await send({name:f.name,email:f.email,subject:'Enquiry: '+f.topic,message:f.message+(f.phone?'\nPhone: '+f.phone:'')});
 m.className='msg ok';m.textContent='Thanks '+f.name+'. We sent a confirmation to '+f.email+'.';e.target.reset()}catch(x){m.className='msg er';m.textContent='Could not send. Email us at '+CFG.email}};
</script></body></html>
