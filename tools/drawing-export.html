<script type="application/json" id="pds-meta">{"name": "Drawing Export", "product": "Aveva E3D", "module": "Draw", "cat": "PML", "ver": "2.1", "price": {"Monthly": 450, "Annual": 4500, "Lifetime": 6750}, "summary": "Exports finished drawings from E3D Draw in bulk.", "img": "media/aveva.png", "yt": "", "order": 6}</script>

<div id="ft"></div>
<script>var ROOT="../"</script><script src="../site-data.js"></script><script src="../app.js"></script>
<script>
const M=JSON.parse($('#pds-meta').textContent),pl=$('#pl'),ad=$('#ad');
pl.innerHTML=Object.entries(M.price).map(([p,v])=>`<option value="${p}">${p} · ${inr(v)}</option>`).join('');
$('#th').innerHTML=M.img?`<img src="${ROOT+M.img}" alt="${M.name} preview">`:'<span>GIF preview coming soon</span>';
$('#vd').innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+(M.yt||CFG.demo)+'?rel=0&modestbranding=1" title="'+M.name+' demo video" allow="accelerometer;encrypted-media;picture-in-picture;fullscreen" allowfullscreen loading="lazy"></iframe>';
function sync(){const c=cart.get()[M.name];pl.value=c||'Annual';ad.textContent=c?'Remove from cart':'Add to cart';ad.className='btn'+(c?' alt':'')}
ad.onclick=()=>{const c=cart.get();if(c[M.name])delete c[M.name];else c[M.name]=pl.value;cart.set(c);sync()};
pl.onchange=()=>{const c=cart.get();if(c[M.name]){c[M.name]=pl.value;cart.set(c)}};sync();
</script></body></html>
